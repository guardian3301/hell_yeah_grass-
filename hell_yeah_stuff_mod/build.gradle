plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

group = 'com.example.hell_yeah_stuff'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.233'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        hell_yeah_stuff {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// Костыль для Java 25-хоста: Gradle 8.13 не поддерживает JDK 25 (Type T not present)
// Если org.gradle.java.home уже указывает на JDK 21 — этот блок просто неактивен
tasks.withType(Test).configureEach {
    enabled = false
}
